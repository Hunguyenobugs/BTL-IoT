<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập | IoT PTIT</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/login.css" />
  <meta name="description" content="Đăng nhập hệ thống IoT PTIT" />
</head>

<body class="login-page-body">
  <div class="login-card-wrap">
    <div class="login-header">
      <h1 class="logo">IoT PTIT</h1>
      <p class="login-subtitle">Hệ thống giám sát và điều khiển thiết bị IoT</p>
    </div>

    <!-- Tabs chuyển đổi Đăng nhập / Đăng ký -->
    <div class="login-tabs">
      <button type="button" class="login-tab-btn is-active" id="tab-login">Đăng nhập</button>
      <button type="button" class="login-tab-btn" id="tab-register">Đăng ký</button>
    </div>

    <!-- Form Đăng nhập -->
    <section id="pane-login">
      <div id="login-error" class="auth-form-error"></div>
      <form id="form-page-login">
        <div class="auth-form-group">
          <label for="login-username">Tên đăng nhập</label>
          <input type="text" id="login-username" placeholder="Nhập tên đăng nhập" required autocomplete="username" />
        </div>
        <div class="auth-form-group">
          <label for="login-password">Mật khẩu</label>
          <input type="password" id="login-password" placeholder="Nhập mật khẩu" required
            autocomplete="current-password" />
        </div>
        <button type="submit" class="btn-auth-submit" id="btn-submit-login">Đăng nhập</button>
      </form>
      <div class="login-footer-text">
        Chưa có tài khoản? <a id="switch-to-register">Đăng ký ngay</a>
      </div>
    </section>

    <!-- Form Đăng ký -->
    <section id="pane-register" style="display: none;">
      <div id="reg-error" class="auth-form-error"></div>
      <form id="form-page-register">
        <div class="auth-form-group">
          <label for="reg-username">Tên đăng nhập *</label>
          <input type="text" id="reg-username" placeholder="VD: B23DCCN999" required autocomplete="username" />
        </div>
        <div class="auth-form-group">
          <label for="reg-password">Mật khẩu *</label>
          <input type="password" id="reg-password" placeholder="Tối thiểu 6 ký tự" required
            autocomplete="new-password" />
        </div>
        <div class="auth-form-group">
          <label for="reg-confirm-password">Xác nhận mật khẩu *</label>
          <input type="password" id="reg-confirm-password" placeholder="Nhập lại mật khẩu" required
            autocomplete="new-password" />
        </div>
        <div class="auth-form-group">
          <label for="reg-name">Họ và tên *</label>
          <input type="text" id="reg-name" placeholder="VD: Nguyễn Văn A" required />
        </div>
        <div class="auth-form-group">
          <label for="reg-student-code">Mã sinh viên *</label>
          <input type="text" id="reg-student-code" placeholder="VD: B23DCCN999" required />
        </div>
        <div class="auth-form-group">
          <label for="reg-class">Lớp</label>
          <input type="text" id="reg-class" placeholder="VD: D23CNPM01" />
        </div>
        <div class="auth-form-group">
          <label for="reg-avatar">Avatar (URL)</label>
          <input type="url" id="reg-avatar" placeholder="https://example.com/avatar.jpg" />
        </div>
        <div class="auth-form-group">
          <label for="reg-github">GitHub</label>
          <input type="url" id="reg-github" placeholder="https://github.com/username" />
        </div>
        <div class="auth-form-group">
          <label for="reg-figma">Figma</label>
          <input type="url" id="reg-figma" placeholder="https://figma.com/..." />
        </div>
        <div class="auth-form-group">
          <label for="reg-postman">Postman</label>
          <input type="url" id="reg-postman" placeholder="https://postman.com/..." />
        </div>
        <div class="auth-form-group">
          <label for="reg-report">Báo cáo</label>
          <input type="url" id="reg-report" placeholder="https://drive.google.com/..." />
        </div>
        <button type="submit" class="btn-auth-submit" id="btn-submit-register">Tạo tài khoản</button>
      </form>
      <div class="login-footer-text">
        Đã có tài khoản? <a id="switch-to-login">Đăng nhập ngay</a>
      </div>
    </section>
  </div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>

</html>
